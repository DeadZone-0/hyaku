[package]
name = "hyaku-client"
version = "0.1.0"
edition = "2021"

[dependencies]
hyaku-protocol = { path = "../hyaku-protocol" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tempfile = "3"
getrandom = "0.3"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
rodio = { version = "0.21", default-features = false, features = ["playback"] }
