[package]
name = "hyaku-client"
version = "0.1.0"
edition = "2021"

[dependencies]
hyaku-protocol = { path = "../hyaku-protocol" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
ratatui = "0.30"
crossterm = { version = "0.28", features = ["event-stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
